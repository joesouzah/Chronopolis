name: Verificar Chronopolis
on:
  pull_request:
    branches: [main]
  push:
    branches: ['rebuild/**']
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar arquivos e acervo
        run: node tests/check-site.mjs
